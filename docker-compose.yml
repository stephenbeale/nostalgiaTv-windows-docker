services:
  nostalgiatv:
    image: purestream711/nostalgiatv-server:latest
    container_name: nostalgiatv-server
    ports:
      - "19850:19850"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logos:/app/logos
    environment:
      # Change in a .env file next to this one, e.g. TZ=America/New_York
      - TZ=${TZ:-Europe/London}
    extra_hosts:
      # Lets the container reach a Jellyfin/Plex/Emby server running on this PC
      # at http://host.docker.internal:<port>
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
